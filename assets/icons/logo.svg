<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
  <title id="title">GeoMem-VLA</title>
  <desc id="desc">GeoMem above VLA, with compact spacing</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="0.52" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="24" fill="url(#background)"/>
  <text x="200" y="108" text-anchor="middle" fill="url(#text)"
        font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="98" font-weight="700" letter-spacing="-4">GeoMem</text>
  <text x="200" y="214" text-anchor="middle" fill="#1E293B"
        font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="104" font-weight="600" letter-spacing="10">VLA</text>
</svg>
